services:
  termix:
    image: ghcr.io/lukegus/termix
    container_name: termix
    restart: unless-stopped
    volumes:
      - ${TERMIX_DATA_FOLDER:-./data}:/app/data
    networks:
      local:
        ipv4_address: 172.${SUBNET_NUMBER:-20}.0.2

networks:
  local:
    name: termix-local-network
    ipam:
      config:
        - subnet: 172.${SUBNET_NUMBER:-20}.0.0/16